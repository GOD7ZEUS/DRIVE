ext {
    minSdkVersion = 24
    // compileSdkVersion (API surface to compile against) and targetSdkVersion
    // (runtime behavior the app opts into) are independent — the androidx
    // dependencies below require compiling against 36, but targeting 36 at
    // runtime enforces edge-to-edge display (content drawing under the status/
    // nav bars) with no safe-area handling in this app's CSS, which is what
    // was causing content to not fit the screen. Staying on target 34 avoids
    // that opt-in while still compiling against the newer API surface.
    compileSdkVersion = 36
    targetSdkVersion = 34
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}