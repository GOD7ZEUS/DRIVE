# App name must be globally unique on Fly.io — `fly launch` will prompt to
# confirm or change this if "drive-royalconstruct" is already taken.
app = "drive-royalconstruct"
primary_region = "bom"

[build]

[env]
  NODE_ENV = "production"
  DB_PATH = "/data/tracker.db"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "drive_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
